name: Keep Alive

# 목적: 무료 프로젝트의 '7일 미사용 시 일시정지'를 방지한다.
# 개선점(v2):
#  - REST select 대신 실제 DB 함수(RPC get_vehicle)를 호출해 '확실한 DB 활동'을 만든다.
#  - 하루 2회 실행으로 활동 밀도를 높인다.
#  - HTTP 000(연결 실패)/5xx를 실패로 처리한다. (v1은 000을 성공으로 오인했음)

on:
  schedule:
    - cron: '23 3 * * *'      # 매일 03:23 UTC (한국 12:23)
    - cron: '23 15 * * *'     # 매일 15:23 UTC (한국 00:23)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ping Supabase RPC (real DB activity)
        run: |
          KEY="sb_publishable_hqsnudfSFzN78mCy3s92Qw_ZXBMl782"
          BASE="https://ydladdffjqpcjynqpjdd.supabase.co/rest/v1"
          # 1) 실제 함수 실행: get_vehicle (anon 실행 가능, DB 쿼리를 실제로 돌린다)
          code=$(curl -s -o /tmp/resp.txt -w "%{http_code}" -X POST "$BASE/rpc/get_vehicle" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            --data '{"p_token":"keepalive-ping"}' --max-time 30)
          echo "RPC get_vehicle -> HTTP $code"
          head -c 300 /tmp/resp.txt || true; echo
          # 2) 보조: 테이블 REST 요청도 한 번 더 두드린다
          code2=$(curl -s -o /dev/null -w "%{http_code}" \
            "$BASE/vehicles?select=token&limit=1" \
            -H "apikey: $KEY" --max-time 30)
          echo "REST vehicles -> HTTP $code2"
          # 판정: 둘 다 '도달' 실패(000) 또는 서버 오류(5xx)면 실패로 알림
          fail=1
          for c in "$code" "$code2"; do
            if [ -n "$c" ] && [ "$c" != "000" ] && [ "$c" -lt 500 ]; then fail=0; fi
          done
          if [ "$fail" = "1" ]; then
            echo "::error::Supabase unreachable (get_vehicle=$code, vehicles=$code2)"
            exit 1
          fi
          echo "Keep-alive OK: Supabase reached."

      - name: Record timestamp (keep repo active)
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ  keep-alive ping" > .keepalive
          git config user.name  "keepalive-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .keepalive
          git commit -m "chore: keep-alive $(date -u +%F)" || echo "no change to commit"
          git push
